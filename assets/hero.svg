<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1200 350" role="img" aria-labelledby="t d">
  <title id="t">Share Proxmox Backup Server</title>
  <desc id="d">Alice and Bob each run PVE, PBS and rclone. The PBS of each person sends encrypted backups directly to a folder on the rclone server of the other person. Tailscale only helps the nodes find each other and carries no backup data.</desc>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .flow{fill:none;stroke-width:2.5;stroke-dasharray:7 7;animation:flow 1.2s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-14}}
    @media (prefers-reduced-motion:reduce){.flow{animation:none}.pkt{display:none}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#1a0016"/>
    </linearGradient>
    <linearGradient id="tun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff22d4" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ff22d4" stop-opacity=".04"/>
    </linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="3"/></filter>
    <marker id="mm" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#ff22d4"/></marker>
    <marker id="mw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#fff"/></marker>
    <symbol id="srv" viewBox="0 0 28 20">
      <g fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.5">
        <rect x="1" y="1" width="26" height="8" rx="2"/>
        <rect x="1" y="11" width="26" height="8" rx="2"/>
      </g>
      <circle cx="6" cy="5" r="1.3" fill="#fff" fill-opacity=".6"/>
      <circle cx="6" cy="15" r="1.3" fill="#fff" fill-opacity=".6"/>
    </symbol>
    <symbol id="lock" viewBox="0 0 12 14">
      <rect y="6" width="12" height="8" rx="2" fill="currentColor"/>
      <path d="M3 6V4a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/>
    </symbol>
    <g id="node">
      <rect width="100" height="64" rx="12" fill="#0d0d0d" stroke="#fff" stroke-opacity=".22" stroke-width="1.5"/>
      <use href="#srv" x="36" y="10" width="28" height="20"/>
    </g>
    <path id="folder" d="M0 14V58a6 6 0 0 0 6 6H94a6 6 0 0 0 6-6V20a6 6 0 0 0-6-6H44L36 4H6a6 6 0 0 0-6 6Z" stroke-width="1.5"/>
    <g id="pkt"><circle r="9" fill="currentColor" filter="url(#glow)"/><circle r="4.5" fill="currentColor"/></g>
  </defs>

  <rect y="70" width="1200" height="350" rx="24" fill="url(#bg)"/>

  <!-- Panels -->
  <rect x="40" y="100" width="400" height="296" rx="20" fill="#080808" stroke="#fff" stroke-opacity=".14"/>
  <rect x="760" y="100" width="400" height="296" rx="20" fill="#080808" stroke="#fff" stroke-opacity=".14"/>
  <circle cx="66" cy="127" r="5" fill="#ff22d4"/>
  <text x="80" y="132" font-size="13" font-weight="600" letter-spacing="3" fill="#fff" fill-opacity=".6">ALICE</text>
  <circle cx="786" cy="127" r="5" fill="#fff"/>
  <text x="800" y="132" font-size="13" font-weight="600" letter-spacing="3" fill="#fff" fill-opacity=".6">BOB</text>

  <!-- Tailscale only helps the nodes find each other: dotted lines, no packets -->
  <path d="M525 128H440M675 128H760" stroke="#fff" stroke-opacity=".4" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 6" fill="none"/>
  <rect x="525" y="108" width="150" height="40" rx="12" fill="#0d0d0d" stroke="#fff" stroke-opacity=".22" stroke-width="1.5"/>
  <g transform="translate(541 118)" fill="#fff">
    <circle cx="3" cy="3" r="2.6" opacity=".35"/><circle cx="11" cy="3" r="2.6" opacity=".35"/><circle cx="19" cy="3" r="2.6" opacity=".35"/>
    <circle cx="3" cy="11" r="2.6"/><circle cx="11" cy="11" r="2.6"/><circle cx="19" cy="11" r="2.6"/>
    <circle cx="3" cy="19" r="2.6" opacity=".35"/><circle cx="11" cy="19" r="2.6"/><circle cx="19" cy="19" r="2.6" opacity=".35"/>
  </g>
  <text x="574" y="133" font-size="15" font-weight="600" fill="#fff">Tailscale</text>
  <text x="600" y="168" text-anchor="middle" font-size="11" fill="#fff" fill-opacity=".6">finds peers, no data</text>

  <!-- Direct tunnel between the sites -->
  <rect x="450" y="184" width="300" height="204" rx="24" fill="none" stroke="#ff22d4" stroke-width="5" stroke-opacity=".6" filter="url(#glow)"/>
  <rect x="450" y="184" width="300" height="204" rx="24" fill="url(#tun)" stroke="#ff22d4" stroke-width="2"/>
  <text x="600" y="352" text-anchor="middle" font-size="13" fill="#fff" fill-opacity=".7">S3 over TLS</text>
  <rect x="505" y="373" width="190" height="30" rx="15" fill="#ff22d4"/>
  <use href="#lock" x="521" y="381" width="12" height="14" color="#000"/>
  <text x="541" y="393" font-size="13" font-weight="800" letter-spacing="2" fill="#000">DIRECT TUNNEL</text>

  <!-- Flows: magenta is data of Alice, white is data of Bob -->
  <path class="flow" d="M170 202H310" stroke="#ff22d4" marker-end="url(#mm)"/>
  <path class="flow" d="M1030 202H890" stroke="#fff" marker-end="url(#mw)"/>
  <path class="flow" d="M310 342H170" stroke="#fff" marker-end="url(#mw)"/>
  <path class="flow" d="M890 342H1030" stroke="#ff22d4" marker-end="url(#mm)"/>
  <path id="x1" class="flow" d="M410 202C600 202 600 342 790 342" stroke="#ff22d4" marker-end="url(#mm)"/>
  <path id="x2" class="flow" d="M790 202C600 202 600 342 410 342" stroke="#fff" marker-end="url(#mw)"/>

  <!-- Encryption on the PVE to PBS links -->
  <use href="#lock" x="234" y="174" width="12" height="14" color="#ff22d4"/>
  <text x="240" y="224" text-anchor="middle" font-size="11" fill="#fff" fill-opacity=".6">encrypted</text>
  <use href="#lock" x="954" y="174" width="12" height="14" color="#fff"/>
  <text x="960" y="224" text-anchor="middle" font-size="11" fill="#fff" fill-opacity=".6">encrypted</text>

  <!-- Alice -->
  <use href="#node" x="70" y="170"/><text x="120" y="220" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">PVE</text>
  <use href="#node" x="310" y="170"/><text x="360" y="220" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">PBS</text>
  <use href="#node" x="310" y="310"/><text x="360" y="360" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">rclone</text>
  <use href="#folder" x="70" y="310" fill="#fff" fill-opacity=".1" stroke="#fff"/>
  <use href="#lock" x="96" y="341" width="12" height="14" color="#fff"/>
  <text x="114" y="354" font-size="15" font-weight="600" fill="#fff">bob</text>

  <!-- Bob -->
  <use href="#node" x="1030" y="170"/><text x="1080" y="220" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">PVE</text>
  <use href="#node" x="790" y="170"/><text x="840" y="220" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">PBS</text>
  <use href="#node" x="790" y="310"/><text x="840" y="360" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">rclone</text>
  <use href="#folder" x="1030" y="310" fill="#ff22d4" fill-opacity=".14" stroke="#ff22d4"/>
  <use href="#lock" x="1053" y="341" width="12" height="14" color="#ff22d4"/>
  <text x="1071" y="354" font-size="15" font-weight="600" fill="#ff22d4">alice</text>

  <!-- Packets that cross between the sites -->
  <use href="#pkt" class="pkt" color="#ff22d4">
    <animateMotion dur="5s" begin="0s" repeatCount="indefinite"><mpath href="#x1"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="5s" begin="0s" repeatCount="indefinite"/>
  </use>
  <use href="#pkt" class="pkt" color="#ff22d4">
    <animateMotion dur="5s" begin="-1.67s" repeatCount="indefinite"><mpath href="#x1"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="5s" begin="-1.67s" repeatCount="indefinite"/>
  </use>
  <use href="#pkt" class="pkt" color="#ff22d4">
    <animateMotion dur="5s" begin="-3.33s" repeatCount="indefinite"><mpath href="#x1"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="5s" begin="-3.33s" repeatCount="indefinite"/>
  </use>
  <use href="#pkt" class="pkt" color="#fff">
    <animateMotion dur="5s" begin="-0.8s" repeatCount="indefinite"><mpath href="#x2"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="5s" begin="-0.8s" repeatCount="indefinite"/>
  </use>
  <use href="#pkt" class="pkt" color="#fff">
    <animateMotion dur="5s" begin="-2.47s" repeatCount="indefinite"><mpath href="#x2"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="5s" begin="-2.47s" repeatCount="indefinite"/>
  </use>
  <use href="#pkt" class="pkt" color="#fff">
    <animateMotion dur="5s" begin="-4.13s" repeatCount="indefinite"><mpath href="#x2"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="5s" begin="-4.13s" repeatCount="indefinite"/>
  </use>
</svg>
